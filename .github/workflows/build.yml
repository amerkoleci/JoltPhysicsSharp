name: Build

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7
        
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: ./global.json

    - name: Pack
      run: dotnet pack JoltPhysicsSharp.slnx --configuration Release

    - name: Publish to NuGet
      if: github.event_name == 'push'
      run: dotnet nuget push artifacts/package/release/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate --source https://api.nuget.org/v3/index.json          
